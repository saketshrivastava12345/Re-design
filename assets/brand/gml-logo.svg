<!--
  GML INDIA lockup - the meridian mark (the prime meridian the company is named
  for) with the wordmark. The type is drawn as outlines, not as <text>, so the
  file renders identically wherever it is used, including inside an <img> where
  web fonts are not available.

  THIS FILE IS THE DROP-IN SLOT FOR THE OFFICIAL ARTWORK. Replace it with the
  official Greenwich Meridian Logistics logo and every place the logo appears
  updates at once; nothing else needs editing. The <img> is sized
  height: 38px / width: auto, so any ratio works.
-->
